# Exo model catalog: providers, model metadata and default role routes.
# Data, not code (docs/STANDALONE.md 1.2, "provider plugins: lift as data").
# User config overrides any table here (a provider table merges over its entry key by key). A key is
# looked up by the name in `key_env`: the environment, then the macOS Keychain (service "exo"), Linux
# Secret Service when `secret-tool` is available, then ~/.config/exo/keys.env (0600; override with
# EXO_KEYS_FILE).
# `key_env` may be a list (one credential per variable, rotated in order). A config table that sets
# `base_url` does not take this `key_env`: it uses only the `key_env` it sets, or none.
# `roles = [...]` limits a provider to those roles.
# Prices are USD per million tokens (Anthropic first-party list prices, cached 2026-10-06).
# cache_write defaults to 1.25 x input when omitted.

[providers.anthropic]
transport = "anthropic"
base_url = "https://api.anthropic.com"
key_env = "ANTHROPIC_API_KEY"

[providers.openrouter]
transport = "openai"
base_url = "https://openrouter.ai/api/v1"
key_env = "OPENROUTER_API_KEY"

[providers.openai]
transport = "openai"
base_url = "https://api.openai.com/v1"
key_env = "OPENAI_API_KEY"

# Google AI Studio's Gemini Developer API via its OpenAI Chat Completions compatibility endpoint.
# This is not the native Gemini API or Vertex AI OAuth. See https://ai.google.dev/gemini-api/docs/openai
[providers.gemini]
transport = "openai"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
key_env = "GEMINI_API_KEY"

# Local OpenAI-compatible servers: no key, the small-model and device path.
[providers.llamacpp]
transport = "openai"
base_url = "http://127.0.0.1:8080/v1"
local = true

[providers.ollama]
transport = "openai"
base_url = "http://127.0.0.1:11434/v1"
local = true

[providers.lmstudio]
transport = "openai"
base_url = "http://127.0.0.1:1234/v1"
local = true

[providers.vllm]
transport = "openai"
base_url = "http://127.0.0.1:8000/v1"
local = true

# OpenCode Go subscription. Verified 2026-10-12 against https://opencode.ai/docs/go/ : the
# OpenAI-compatible endpoint is https://opencode.ai/zen/go/v1/chat/completions (glm, kimi,
# deepseek, mimo and others). Other Go models use /responses or /messages and are not served by
# this transport. The docs do not name the auth header; Bearer is the OpenAI-compatible default.
# The models list is at https://opencode.ai/zen/go/v1/models. Model refs look like
# "opencode-go:kimi-k3".
[providers.opencode-go]
transport = "openai"
base_url = "https://opencode.ai/zen/go/v1"
key_env = "OPENCODE_GO_API_KEY"
# Go asks for a stable per-conversation id (routing, prompt caching) and a named user agent.
session_header = "x-opencode-session"
# Go also lists models served only over /responses (GPT, Grok, Muse) or /messages (Claude, MiniMax, Qwen).
# Exo speaks chat/completions to Go today, so pickers hide those until their transports land.
hide_models = ["gpt", "grok", "claude", "minimax", "qwen", "muse"]

# Nous Portal. Verified 2026-10-12 with a live key: a plain Bearer API key works and /models lists
# OpenAI-compatible routes (Anthropic, OpenAI, GLM, Qwen and others). Model refs look like
# "nous:anthropic/claude-sonnet-5.5".
[providers.nous]
transport = "openai"
base_url = "https://inference-api.nousresearch.com/v1"
key_env = "NOUS_API_KEY"

# Claude subscription through the `claude` CLI (OAuth login, no API key; ANTHROPIC_API_KEY is dropped
# from the subprocess). Available only when `claude` is on PATH. Text-only: calls that carry Exo tools
# fail and the router falls back. Model refs look like "claude-cli:sonnet".
[providers.claude-cli]
transport = "claude-cli"
command = "claude"
models = ["sonnet", "opus", "haiku"]

# Muse Code subscription through the `muse` CLI (its own login, no key in Exo; META_API_KEY is dropped from
# the subprocess). Available only when `muse` is on PATH. Text only: calls that carry Exo tools are refused
# and the router falls back. One `muse exec` process per turn, so it is slower than an API route. On macOS the
# native binary needs signing for keychain access; a shell launcher has unknown signing state and is allowed.
# Model refs look like "muse-cli:default" (the CLI's own default).
[providers.muse-cli]
transport = "muse-cli"
command = "muse"
models = ["default"]
roles = ["aux"]

# TypeSafe Jev: a decision model (probabilities, not text), so decision role only.
# Verified https://docs.typesafe.ai/api.md : POST https://api.typesafe.ai/v1/systemone,
# Authorization: Bearer. Question shapes verified live 2026-10-11 (see decision.py). Default first
# route of the decision role; without a key it is skipped and Laya, then aux and main, answer.
[providers.jev]
transport = "decision"
base_url = "https://api.typesafe.ai/v1"
key_env = "TYPESAFE_API_KEY"
roles = ["decision"]

# Models are keyed "provider:model".
[models."anthropic:claude-opus-5-5"]
context = 1000000
max_output = 128000
input = 4.00
output = 20.00
cache_read = 0.20

[models."anthropic:claude-sonnet-5-5"]
context = 1000000
max_output = 128000
input = 2.00
output = 10.00
cache_read = 0.20

[models."anthropic:claude-haiku-5-5"]
context = 1000000
max_output = 128000
input = 0.10
output = 0.50

[models."anthropic:claude-fable-5-1"]
context = 1000000
max_output = 128000
input = 10.00
output = 50.00
cache_read = 0.25

# Roles: each is an ordered route list; the first available route serves, the rest
# are fallbacks. Resolution when a role is empty or every route fails:
#   decision -> aux -> main;  eval -> main;  aux -> main.
# "decision" is for cheap structured choices: routing, gating, classification,
# tool selection, whether to show a UI panel. Leave it empty to use aux.
[roles]
main = ["anthropic:claude-opus-5-5", "openrouter:anthropic/claude-opus-5.5"]
aux = ["anthropic:claude-haiku-5-5"]
decision = ["jev:jev-latest", "laya:laya"]
# "eval" is the judge for scoring and the learning loop. Empty means the main route (D-018).
eval = []
# Cost tiers for subagents (delegate tool). Resolution: fast -> standard -> main;
# standard -> main; deep -> main. A tier whose provider has no key is skipped, so
# local-only setups fall back to main. Override any of these in config [models.roles].
fast = ["anthropic:claude-haiku-5-5"]
standard = ["anthropic:claude-sonnet-5-5"]
deep = ["anthropic:claude-opus-5-5"]

# Decision default (D-018) is local Laya, served by `laya-serve` (pip install "laya[serve]"), which
# speaks the same /v1/systemone as Jev. Its default port is 8000 (LAYA_PORT changes it); model ids are
# laya, laya-multilingual and laya-typed-decisions. Setup and size: docs/PROVIDERS.md. If the server is
# not running the route fails fast and the role falls back to aux, then main (generative JSON answers).
# Laya is the second decision route, after Jev (base Laya is weak zero-shot, so it is a fallback).
[providers.laya]
transport = "decision"
base_url = "http://127.0.0.1:8000/v1"
local = true
roles = ["decision"]
