[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "exo"
version = "0.2.0"
description = "Generic mechanism for a personal AI system: signed ledger, principal store, retrieval."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*"]
requires-python = ">=3.11"
authors = [{ name = "Aska Digital" }]
dependencies = ["pynacl>=1.5", "httpx>=0.27"]

[project.optional-dependencies]
chatgpt = ["PyJWT[crypto]>=2.10.1,<3"]
dev = ["pytest>=7", "ruff>=0.6", "mypy==2.4.0"]
# httpx2 is imported directly for MCP servers that need request headers; mcp 2 also depends on it.
mcp = ["mcp>=2,<3", "httpx2>=2"]
# rich is imported directly by the terminal client; textual depends on it too.
tui = ["textual>=1", "rich>=13"]
# starlette is imported directly by the bus MCP server; fastapi depends on it too.
bus = ["fastapi>=0.110", "starlette>=0.37", "uvicorn>=0.29", "websockets>=12"]

[project.scripts]
exo = "exo.cli:main"
exo-witness = "exo.ledger_authority.witness_transport:main"

[tool.hatch.build.targets.wheel]
packages = ["src/exo", "clients/tui/exo_tui"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "exo/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_claude: runs one real turn through the claude CLI; needs EXO_TEST_REAL_CLAUDE=1 and claude on PATH",
]

# Lint: pyflakes rules only (F). Findings fail CI.
[tool.ruff]
target-version = "py311"
extend-exclude = ["patches", "research", ".venv"]

[tool.ruff.lint]
select = ["F"]
