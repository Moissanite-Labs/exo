[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exo-tui"
version = "0.2.0"
description = "Terminal client for Exo (Textual)"
requires-python = ">=3.11"
# The core is the Exo repo root (distribution name "exo" is taken on PyPI by another project), so the
# client does not depend on it by name: install the repo root first (pip install -e ../..), then this.
dependencies = ["textual>=0.80"]

[project.scripts]
exo-tui = "exo_tui:main"

[tool.setuptools]
packages = ["exo_tui"]

[tool.setuptools.package-data]
exo_tui = ["hints.toml"]
