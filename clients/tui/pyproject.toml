[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exo-tui"
version = "0.1.0"
description = "Terminal client for Exo (Textual)"
requires-python = ">=3.11"
dependencies = ["textual>=0.80", "exo"]

[project.scripts]
exo-tui = "exo_tui:main"

[tool.setuptools]
packages = ["exo_tui"]

[tool.setuptools.package-data]
exo_tui = ["hints.toml"]
