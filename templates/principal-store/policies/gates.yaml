# Action gates: reversibility x exposure.
# Every action an agent takes is placed in one cell. The cell decides whether the agent
# acts, acts and reports, or waits for the principal. Edit the cells to fit the principal.
#
# reversibility: how hard it is to undo
#   reversible    undo is one step and costs nothing (edit a draft, create a branch)
#   costly        undo is possible but takes work or money (merge, send to a teammate)
#   irreversible  cannot be undone (publish, delete, pay, send to a third party)
# exposure: who can see the result
#   private       only the principal and their agents
#   internal      the principal's team or organisation
#   public        anyone, or a named third party
#
# decisions:
#   act         go ahead, log the action
#   report      go ahead, include it in the next report
#   ask         wait for the principal's approval on their channel, with a link and a default

version: 1
matrix:
  reversible:
    private: act
    internal: act
    public: ask
  costly:
    private: act
    internal: report
    public: ask
  irreversible:
    private: ask
    internal: ask
    public: ask

# Decisions also accept the gate's own words: allow (= act), log (= report), ask, deny.

# Where actions land. Targets are repos (owner/name), hosts, chat targets or paths, matched
# as globs. An action on a target listed here counts as internal or private, and not as a
# third-party effect. Example: internal: ["my-org/*", "discord:#my-team"].
scopes:
  private: []
  internal: []

# Per-category decision that replaces the matrix cell. Categories come from exo.gate, for
# example: read, local_write, shell, delete, history_rewrite, force_push, vcs_push, vcs_merge,
# github_post, github_close, publish, deploy_preview, deploy_production, web_post,
# message_send, email_send, social_post, payment, credentials, account, schedule, browser.
# Example: vcs_merge: act
categories: {}

# Rules for finer cases. The first match wins over the matrix and the category line.
# A deny or ask rule's command regex also matches the decoded shell words ('rm' -rf reads
# as rm -rf); that match can only raise the outcome, never pick a different rule.
# Match keys: category, tool, target (glob), command (regex), exposure, reversibility,
# third_party. Example:
#   - match: {category: vcs_merge, target: "my-org/*"}
#     decision: act
#     reason: merges inside the principal's own org
rules: []

# Extra factors that raise a cell to "ask" regardless of the matrix and the rules.
escalate:
  cost_over_budget: true      # a spend above policies/budget.yaml limits, or of unknown size
  third_party: true           # affects someone outside the principal's scopes
  categories: [credentials, account, payment]   # security settings, sign-ins, new accounts, money

# Actions the principal keeps for themselves, whatever the cell says (always ask).
# Each entry is a category name, "tool:<glob>", "target:<glob>", "command:<regex>",
# or a mapping of match keys. A command regex also matches the decoded shell words.
# Fill from their rulings.
reserved: []

# Actions refused outright instead of asked (deny). Same entry format as reserved. A deny
# entry, a reserved entry, a `categories:` deny and a category deny rule reach every command
# the gate reads on a line, nested ones included. An allow, log or ask category line sees
# only the line's most severe part. A rule's `command` regex is matched against the text
# of the one command it names (for the line, every command on it), so an allow
# rule on `^ls` allows `ls`, not `ls; <anything>`; a deny or reserved `command` regex still
# sees the whole line. See docs/GATE.md "Known limits" for what the gate does not read yet.
deny: []

# What happens when the principal does not answer an ask. The host blocks on timeout, so
# the default is to skip the action.
ask_default: skip
