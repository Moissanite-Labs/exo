# How corrections and rulings become beliefs. Change freely; the code reads these keys.
version: 1
conflict_rule: newer_wins_unless_guarded   # newer_wins | newer_wins_unless_guarded | ask
half_life_days: {preference: 30, rule: 0}  # 0 = no decay; rulings never fade
similarity: 0.6                            # how alike two instructions must be to count as a repeat
rule_of_three: 3                           # repeats before proposing to encode a rule
target_overlap: 0.6
stale_below: 0.2                           # report taste beliefs that faded below this weight
# House taste and how it adapts to you (D-044, docs/TASTE-BASELINE.md section 10).
taste:
  mode: silent                 # silent: changes happen, then show in /taste and the brief; ask: each waits for a yes
# More knobs: copy a line under taste: above to change it; defaults shown.
#   house: on                  # off = start blank: no house taste items on this install
#   baseline_start: 0.7        # a house item's precedence on install day
#   baseline_half_life: 365    # days for that precedence to halve
#   baseline_floor: 0.3        # it never falls below this
#   value_window_start: 0.5    # house value items in the getting-to-know window
#   value_window_days: 30      # the window lasts 30 days and 20 sessions, at most 90 days
#   value_window_sessions: 20
#   value_window_max_days: 90
#   arm_weeks: 3               # net contradicting weeks to arm a shift
#   arm_window_weeks: 8        # ... inside this many weeks
#   fade_half_life_weeks: 4    # an armed item halves every 4 net weeks at full delta
#   swap_below: 0.3            # swap only once the item is below this weight
#   replace_margin: 0.15       # ... and your version leads by this much
#   replace_min: 0.45          # ... and your version is at least this strong
#   flip_cooldown: 90          # days quiet after a swap, an undo or a no
#   max_flips: 2               # swaps in a year before Exo asks instead
#   ask_quiet_after: 3         # unanswered proposals before the brief stops listing them
#   min_confidence: 0.6        # the decision model's labels below this are ignored
#   daily_cap: 50              # decision-model taste questions a day
#   timezone: ""               # IANA name for weeks and days; empty = this machine's zone
