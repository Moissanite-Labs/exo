name: spec conformance

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# pull_request: cancel superseded runs on the same branch (#907).
# merge_group: one run per merge-group ref (no cross-cancel with PRs).
concurrency:
  group: spec-conformance-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  seat-binding-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache tla2tools.jar
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: tla-cache
        with:
          path: specs/seat-binding/tla2tools.jar
          key: tla2tools-v1.8.0-7a0a1e90628ebff2e3e8733375f8b684fa59504d2e02bddc4cb51a7679bb7e04

      - name: Download tla2tools.jar
        if: steps.tla-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          JAR=specs/seat-binding/tla2tools.jar
          mkdir -p specs/seat-binding
          curl -fsSL -o "$JAR" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          echo "7a0a1e90628ebff2e3e8733375f8b684fa59504d2e02bddc4cb51a7679bb7e04  $JAR" | sha256sum -c -

      - name: Verify cached tla2tools.jar
        if: steps.tla-cache.outputs.cache-hit == 'true'
        run: |
          echo "7a0a1e90628ebff2e3e8733375f8b684fa59504d2e02bddc4cb51a7679bb7e04  specs/seat-binding/tla2tools.jar" | sha256sum -c -

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install test dependencies for trace emission
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,tui]"

      - name: Emit seat-binding conformance traces
        env:
          EXO_SEAT_BINDING_TRACE_DIR: ${{ runner.temp }}/seat-binding-emitted-traces
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/clients/tui
        run: |
          set -euo pipefail
          mkdir -p "$EXO_SEAT_BINDING_TRACE_DIR"
          pytest_log="${RUNNER_TEMP}/seat-binding-emission-pytest.log"
          pytest tests/test_seat_binding_conformance_traces.py -v --strict-markers --strict-config \
            --seat-binding-trace-dir "$EXO_SEAT_BINDING_TRACE_DIR" -rs \
            2>&1 | tee "$pytest_log"
          if grep -E '=== .* skipped .* ===|SKIPPED \[|deselected' "$pytest_log"; then
            echo "seat-binding emission: skipped or deselected tests are not allowed"
            exit 1
          fi
          for name in new_after_resume.jsonl refusal.jsonl; do
            file="$EXO_SEAT_BINDING_TRACE_DIR/$name"
            if [ ! -s "$file" ]; then
              echo "seat-binding emission: missing or empty trace $file"
              exit 1
            fi
          done

      - name: Replay conforming seat-binding traces
        env:
          TLA2TOOLS_JAR: ${{ github.workspace }}/specs/seat-binding/tla2tools.jar
        run: |
          set -euo pipefail
          golden="${RUNNER_TEMP}/seat-binding-golden-traces"
          emitted="${RUNNER_TEMP}/seat-binding-emitted-traces"
          mkdir -p "$golden"
          shopt -s nullglob
          good=(specs/seat-binding/conformance/traces/good_*.jsonl)
          if [ "${#good[@]}" -eq 0 ]; then
            echo "No conforming traces (good_*.jsonl) found under specs/seat-binding/conformance/traces/"
            exit 2
          fi
          cp "${good[@]}" "$golden"/
          for name in new_after_resume.jsonl refusal.jsonl; do
            file="$emitted/$name"
            if [ ! -s "$file" ]; then
              echo "seat-binding replay: missing or empty emitted trace $file"
              exit 1
            fi
            cp "$file" "$golden"/
          done
          echo "Including 2 emitted trace(s) from tests"
          start=$(date +%s.%N)
          set +e
          python3 specs/seat-binding/conformance/replay.py --all "$golden"
          exit_code=$?
          set -e
          end=$(date +%s.%N)
          wall=$(awk -v s="$start" -v e="$end" 'BEGIN { printf "%.3f", e - s }')
          echo "replay_wall_time_seconds=$wall"
          if [ "$exit_code" -ne 0 ]; then
            case "$exit_code" in
              1) echo "replay.py exited 1: violation (TLC invariant or unreplayable step)" ;;
              2) echo "replay.py exited 2: malformed trace (JSONL/schema validation)" ;;
              3) echo "replay.py exited 3: missing toolchain (Java/jar/checksum)" ;;
              *) echo "replay.py exited $exit_code" ;;
            esac
            exit "$exit_code"
          fi
          echo "replay.py exited 0: all conforming traces passed."

      - name: Check negative trace fixtures
        env:
          TLA2TOOLS_JAR: ${{ github.workspace }}/specs/seat-binding/tla2tools.jar
        run: python3 specs/seat-binding/conformance/check_negative_fixtures.py

      - name: Check scratch production mutations (pinned VIOLATION lines)
        env:
          TLA2TOOLS_JAR: ${{ github.workspace }}/specs/seat-binding/tla2tools.jar
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/clients/tui
        run: python3 specs/seat-binding/conformance/check_scratch_mutations.py
