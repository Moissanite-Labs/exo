name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --all-extras --python 3.13
      # Pyflakes rules only (F, set in pyproject.toml). --exit-zero for now: the tree still has unused imports
      # (F401) that other branches are editing. Remove --exit-zero once they are cleaned up.
      - run: uv run ruff check --exit-zero .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    env:
      # Plugin suites reach for a bus; point them at a closed port so nothing leaves the runner.
      EXO_BUS_URL: http://127.0.0.1:9
      EXO_BUS_SEAT: builder
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --all-extras --python ${{ matrix.python }}
      - name: Root suite
        run: |
          ulimit -n 4096
          uv run pytest -q
      # Each plugin is its own suite with its own conftest, so each runs from its own folder.
      - name: Plugin suites
        shell: bash
        run: |
          ulimit -n 4096
          set -o pipefail
          status=0
          for d in plugins/*/; do
            if [ -d "$d/tests" ]; then
              echo "::group::$d"
              (cd "$d" && uv run --project ../.. pytest -q) || status=1
              echo "::endgroup::"
            fi
          done
          exit $status
      - name: Plugins collected together
        run: uv run pytest plugins -q
