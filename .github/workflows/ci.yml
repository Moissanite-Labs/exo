name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch --depth 1 origin ${{ github.sha }}
          git checkout FETCH_HEAD
      - name: Set up uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv sync --frozen --all-extras --python 3.13
      - run: uv run --frozen --all-extras ruff check .

  types:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch --depth 1 origin ${{ github.sha }}
          git checkout FETCH_HEAD
      - name: Set up uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv sync --frozen --all-extras --python 3.11
      - run: uv run --frozen --all-extras python scripts/check_types.py

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    env:
      # Plugin suites reach for a bus; point them at a closed port so nothing leaves the runner.
      EXO_BUS_URL: http://127.0.0.1:9
      EXO_BUS_SEAT: builder
    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch --depth 1 origin ${{ github.sha }}
          git checkout FETCH_HEAD
      - name: Set up uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv sync --frozen --all-extras --python ${{ matrix.python }}
      - name: Root suite
        run: |
          ulimit -n 4096
          uv run pytest -q
      # Each plugin is its own suite with its own conftest, so each runs from its own folder.
      - name: Plugin suites
        shell: bash
        run: |
          ulimit -n 4096
          set -o pipefail
          status=0
          for d in plugins/*/; do
            if [ -d "$d/tests" ]; then
              echo "::group::$d"
              (cd "$d" && uv run --project ../.. pytest -q) || status=1
              echo "::endgroup::"
            fi
          done
          exit $status
      - name: Plugins collected together
        run: uv run pytest plugins -q
