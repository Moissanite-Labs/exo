name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request replaces its older run, which then only holds runners (#907). Pushes to main
# keep one run per commit.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --all-extras --python 3.13
      - run: uv run --frozen --all-extras ruff check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --all-extras --python 3.11
      - run: uv run --frozen --all-extras python scripts/check_types.py

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    env:
      # Plugin suites reach for a bus; point them at a closed port so nothing leaves the runner.
      EXO_BUS_URL: http://127.0.0.1:9
      EXO_BUS_SEAT: builder
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --all-extras --python ${{ matrix.python }}
      - name: Root suite
        run: |
          ulimit -n 4096
          uv run pytest -q --durations=25 --junitxml=test-results/root.xml
      # Each plugin is its own suite with its own conftest, so each runs from its own folder.
      - name: Plugin suites
        shell: bash
        run: |
          ulimit -n 4096
          set -o pipefail
          status=0
          for d in plugins/*/; do
            if [ -d "$d/tests" ]; then
              echo "::group::$d"
              (cd "$d" && uv run --project ../.. pytest -q --durations=25 --junitxml="$GITHUB_WORKSPACE/test-results/${d#plugins/}plugin.xml") || status=1
              echo "::endgroup::"
            fi
          done
          exit $status
      - name: Plugins collected together
        run: uv run pytest plugins -q --durations=25 --junitxml=test-results/plugins-combined.xml
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}-py${{ matrix.python }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
