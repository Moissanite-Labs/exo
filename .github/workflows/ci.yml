name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    # Serial full suite (no xdist) to catch order-dependent bugs; includes the aggregate plugin pass.
    - cron: "0 6 * * *"

permissions:
  contents: read

# pull_request: one active run per branch head; newer commits cancel the old run (#907).
# merge_group and push use github.sha so entries never share a group or cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras --python 3.13
      - run: uv run --frozen --all-extras ruff check .

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras --python 3.11
      - run: uv run --frozen --all-extras python scripts/check_types.py

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    env:
      # Plugin suites reach for a bus; point them at a closed port so nothing leaves the runner.
      EXO_BUS_URL: http://127.0.0.1:9
      EXO_BUS_SEAT: builder
      EXO_NATIVE_KEYCHAIN_TEST: ${{ matrix.os == 'macos-latest' && '1' || '' }}
      # Nightly schedule stays serial; pull_request, merge_group, and push to main use xdist.
      PYTEST_PARALLEL: ${{ github.event_name == 'schedule' && '' || '-n auto' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras --python ${{ matrix.python }}
      - name: Prepare temporary keychain for native tests
        if: runner.os == 'macOS'
        run: |
          KEYCHAIN=exo-ci-native.keychain-db
          KEYCHAIN_PATH="$HOME/Library/Keychains/$KEYCHAIN"
          security create-keychain -p "" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 7200 "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "CI_KEYCHAIN_HOME=$HOME" >> "$GITHUB_ENV"
      - name: Native macOS Keychain evidence
        if: matrix.os == 'macos-latest'
        run: |
          set -o pipefail
          ulimit -n 4096
          output=$(uv run pytest tests/test_macos_keychain_native.py -v -rA -W error 2>&1 | tee /dev/stderr)
          if echo "$output" | grep -q SKIPPED; then
            echo "native Keychain test must not be skipped on macOS CI"
            exit 1
          fi
          case "$output" in
            *PASSED\ tests/test_macos_keychain_native.py::test_native_keychain_large_generic_password_round_trip*) ;;
            *)
              echo "expected explicit PASSED line for native Keychain test"
              exit 1
              ;;
          esac
      - name: Root suite
        run: |
          ulimit -n 4096
          uv run pytest -q $PYTEST_PARALLEL
      # Each plugin is its own suite with its own conftest, so each runs from its own folder.
      - name: Plugin suites
        shell: bash
        run: |
          ulimit -n 4096
          set -o pipefail
          status=0
          for d in plugins/*/; do
            if [ -d "$d/tests" ]; then
              echo "::group::$d"
              (cd "$d" && uv run --project ../.. pytest -q $PYTEST_PARALLEL) || status=1
              echo "::endgroup::"
            fi
          done
          exit $status
      # Same 3765 tests as the loop; skipped on pull_request only. Serial on schedule, parallel otherwise.
      - name: Plugins collected together
        if: github.event_name != 'pull_request'
        run: |
          ulimit -n 4096
          uv run pytest plugins -q $PYTEST_PARALLEL
      - name: Remove temporary keychain
        if: always() && runner.os == 'macOS'
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
