name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    # Nightly full suite for checks skipped on pull_request (see Plugins collected together).
    - cron: "0 6 * * *"

permissions:
  contents: read

# pull_request: one active run per branch head; newer commits cancel the old run (#907).
# merge_group and push use github.sha so entries never share a group or cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras --python 3.13
      - run: uv run --frozen --all-extras ruff check .

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras --python 3.11
      - run: uv run --frozen --all-extras python scripts/check_types.py

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    env:
      # Plugin suites reach for a bus; point them at a closed port so nothing leaves the runner.
      EXO_BUS_URL: http://127.0.0.1:9
      EXO_BUS_SEAT: builder
      # Parallel root/plugin runs on pull_request only; merge_group, main, and schedule run the full path.
      PYTEST_PARALLEL: ${{ github.event_name == 'pull_request' && '-n auto' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras --python ${{ matrix.python }}
      - name: Root suite
        run: |
          ulimit -n 4096
          uv run pytest -q $PYTEST_PARALLEL
      # Each plugin is its own suite with its own conftest, so each runs from its own folder.
      - name: Plugin suites
        shell: bash
        run: |
          ulimit -n 4096
          set -o pipefail
          status=0
          for d in plugins/*/; do
            if [ -d "$d/tests" ]; then
              echo "::group::$d"
              (cd "$d" && uv run --project ../.. pytest -q $PYTEST_PARALLEL) || status=1
              echo "::endgroup::"
            fi
          done
          exit $status
      # Redundant with per-plugin runs (same 3765 tests) but kept off pull_request for wall time; still runs on main, merge queue, and nightly.
      - name: Plugins collected together
        if: github.event_name != 'pull_request'
        run: uv run pytest plugins -q
