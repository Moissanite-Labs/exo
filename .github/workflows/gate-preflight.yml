name: gate preflight

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# pull_request: one active run per PR; newer commits cancel the old run (#907).
# merge_group: key by ref so queue entries do not cancel each other.
concurrency:
  group: gate-preflight-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  never-looser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXO_BUS_URL: http://127.0.0.1:9
      EXO_BUS_SEAT: builder
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect gate-relevant changes
        id: detect
        run: python3 scripts/gate_preflight_relevant.py --base "$BASE_SHA"
      - uses: astral-sh/setup-uv@v5
        if: steps.detect.outputs.run_full == 'true'
      - run: uv sync --frozen --all-extras --python 3.11
        if: steps.detect.outputs.run_full == 'true'
      - name: Gate plugin acceptance
        if: steps.detect.outputs.run_full == 'true'
        working-directory: plugins/exo-gate
        run: uv run --project ../.. pytest -q
      - name: Compare base with the composed PR tree using the base comparator
        if: steps.detect.outputs.run_full == 'true'
        run: |
          git worktree add --detach "$RUNNER_TEMP/gate-base" "$BASE_SHA"
          uv run python "$RUNNER_TEMP/gate-base/scripts/gate_diff.py" --base "$RUNNER_TEMP/gate-base" --head "$GITHUB_WORKSPACE" --json gate-diff.json
      - name: Preserve differential evidence
        if: always() && steps.detect.outputs.run_full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gate-preflight-differential
          path: gate-diff.json
          if-no-files-found: warn
