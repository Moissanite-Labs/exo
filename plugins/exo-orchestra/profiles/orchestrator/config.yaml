# Exo orchestra profile skeleton: orchestrator
# No model or provider is set here on purpose. Model choice belongs to the principal
# (principal store, policies/). Fill `model:` from there when the profile is created.
model: {}
skills:
  external_dirs:
    - "{{exo_skills_dir}}"
plugins:
  enabled:
    - exo-orchestra
    - exo-gate
    - exo-memory
  entries:
    exo-orchestra:
      settings:
        role: orchestrator
        seat: "{{seat_name}}"
        principal_store: "{{principal_store}}"
        pipeline_stage: "start and end of the pipeline"
        default_skills:
          - control-plane
          - operating-doctrine
          - council
          - choreography
          - clean-writing
