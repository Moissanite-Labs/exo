# Exo orchestra profile skeleton: researcher
# No model or provider is set here on purpose. Model choice belongs to the principal
# (principal store, policies/). Fill `model:` from there when the profile is created.
model: {}
skills:
  external_dirs:
    - "{{exo_skills_dir}}"
plugins:
  enabled:
    - exo-orchestra
    - exo-gate
    - exo-memory
  entries:
    exo-orchestra:
      settings:
        role: researcher
        seat: "{{seat_name}}"
        principal_store: "{{principal_store}}"
        pipeline_stage: "1. research"
        default_skills:
          - operating-doctrine
          - clean-writing
          - github-issues
          - github-draft-review-html
          - charts-in-posts
