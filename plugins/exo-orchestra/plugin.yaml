name: exo-orchestra
version: "0.2.0"
description: "Exo orchestra. The multi-agent system as a generic template: seven seat templates (mission control, orchestrator, researcher, architect, designer, builder, reviewer) in the documented seat format (SEATS.md), the shared skill pack (control plane, doctrine, council, choreography, clean-writing gate, GitHub pack, SYM-2P) loaded natively, and an /orchestra command that lists seats and skills and renders or checks a seat. A principal's own agent names and rules live in the principal store, not here."
author: "Aska Digital"
license: "MIT"
provides_commands:
  - orchestra
config_schema:
  skills_dir:
    type: str
    default: ""
    description: "Skill pack directory. Empty: $EXO_SKILLS_DIR, else the repo's skills/ folder."
  register_skills:
    type: bool
    default: true
    description: "Register every pack skill with the core as exo-orchestra:<name>. Set false to skip."
  principal_store:
    type: str
    default: ""
    description: "Path to the principal store, filled into rendered seats. Empty: $EXO_PRINCIPAL_STORE."
