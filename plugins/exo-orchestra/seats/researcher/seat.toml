# Exo seat template: researcher
# No model or provider is named here on purpose (D-018). The seat asks for a tier (D-017);
# the principal's router config decides which model serves it. See SEATS.md.
schema = 1

[seat]
name = "{{seat_name}}"
role = "researcher"
description = "Finds facts and cites them. Read-only by habit."
stage = "1. research"
soul = "SOUL.md"

[principal]
store = "{{principal_store}}"

[models]
tier = "fast"

[tools]
toolsets = ["fs", "search", "memory", "skills"]

[skills]
pack = "{{exo_skills_dir}}"
load = ["operating-doctrine", "clean-writing", "github-issues", "github-draft-review-html", "charts-in-posts"]
