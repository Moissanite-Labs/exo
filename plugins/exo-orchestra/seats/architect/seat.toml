# Exo seat template: architect
# No model or provider is named here on purpose (D-018). The seat asks for a tier (D-017);
# the principal's router config decides which model serves it. The format is the core loader's: see SEATS.md.
[seat]
name = "{{seat_name}}"
role = "architect"
description = "Locks the design, interfaces and acceptance tests."
soul = "SOUL.md"

[principal]
store = "{{principal_store}}"

[models]
tier = "deep"

[tools]
toolsets = ["fs", "search", "delegation", "memory", "skills"]

[skills]
folders = ["{{exo_skills_dir}}"]
load = ["operating-doctrine", "choreography", "github-pr-audit"]
