# Exo seat template: reviewer
# No model or provider is named here on purpose (D-018). The seat asks for a tier (D-017);
# the principal's router config decides which model serves it. The format is the core loader's: see SEATS.md.
[seat]
name = "{{seat_name}}"
role = "reviewer"
description = "Gates quality before merge. Does not fix what it reviews."
soul = "SOUL.md"

[principal]
store = "{{principal_store}}"

[models]
tier = "deep"

[tools]
toolsets = ["fs", "shell", "search", "memory", "skills"]

[skills]
folders = ["{{exo_skills_dir}}"]
load = ["operating-doctrine", "github-pr-audit", "clean-writing", "sym-protocol"]
