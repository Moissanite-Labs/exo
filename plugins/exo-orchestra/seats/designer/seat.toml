# Exo seat template: designer
# No model or provider is named here on purpose (D-018). The seat asks for a tier (D-017);
# the principal's router config decides which model serves it. The format is the core loader's: see SEATS.md.
[seat]
name = "{{seat_name}}"
role = "designer"
description = "Shapes copy, layout and visuals from the locked design."
soul = "SOUL.md"

[principal]
store = "{{principal_store}}"

[models]
tier = "standard"

[tools]
toolsets = ["fs", "search", "memory", "skills"]

[skills]
folders = ["{{exo_skills_dir}}"]
load = ["operating-doctrine", "clean-writing", "charts-in-posts"]
