name: exo-bus
label: Exo Bus
kind: channel
version: "0.1.0"
description: >
  Exo Bus (signed, hash-chained seat-to-seat messages; wire compatible with Divan Bus) for the Exo core.
  Tools let any profile post to and read the bus. The Channel is a protocol client: it turns bus messages
  addressed to this seat, its team or the group to the core's ingress path (pinned seat keys, hold and trust policy, D-040), and posts the reply back as a signed envelope only for a message the policy delivered on its own. SYM-2P bodies render as plain English.
author: "Aska Digital"
license: "MIT"
provides_tools:
  - bus_post
  - bus_inbox
  - bus_thread
  - bus_verify
  - peers
  - peer_send
provides_hooks:
  - on_session_start
  - pre_llm_call
  - post_llm_call
  - on_session_end
  - on_session_finalize
  - pre_gateway_dispatch
requires_env: []
optional_env:
  - name: EXO_PEERS
    description: "Set to 1 to make this profile a peer: other agent sessions (Exo or Hermes) can list and message it. Off by default. See docs/PEERS.md."
    prompt: "Enable peers"
    password: false
  - name: EXO_BUS_URL
    description: "Relay base URL, for example http://127.0.0.1:8787. Tools and the platform stay off until this and EXO_BUS_SEAT are set."
    prompt: "Exo Bus relay URL"
    password: false
  - name: EXO_BUS_SEAT
    description: "This profile's seat id in the relay's signed registry."
    prompt: "Exo Bus seat id"
    password: false
  - name: EXO_BUS_KEYS_DIR
    description: "Directory holding <seat>.key (0600). Default $EXO_HOME/keys."
    prompt: "Exo Bus keys directory"
    password: false
  - name: EXO_BUS_STATE_DIR
    description: "Where the read cursor is kept. Default $EXO_HOME/bus."
    prompt: "Exo Bus state directory"
    password: false
  - name: EXO_BUS_POLL_SECONDS
    description: "Inbox poll interval for the channel (default 5)."
    prompt: "Exo Bus poll seconds"
    password: false
  - name: EXO_BUS_HOME_CHANNEL
    description: "Default recipient (seat, team:<name> or group) for cron delivery with deliver=exo_bus."
    prompt: "Exo Bus home channel"
    password: false
