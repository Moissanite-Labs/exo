name: exo-command
version: "0.2.0"
manifest_version: 2
description: >-
  Exo command centre, a web client of the Exo protocol. Live sessions, delegated tasks, approvals,
  decisions waiting on the principal, projects and cost, all from protocol queries and the event
  stream. Never opens another program's database. Run it with python -m exo_command.
author: Aska Digital
license: MIT
tags: [exo, web, command-centre, protocol-client]
hooks: []
config_schema:
  socket:
    type: str
    default: ""
    description: exod Unix socket. Empty means $EXO_HOME/run/exod.sock.
  url:
    type: str
    default: ""
    description: exod TCP URL instead of the socket, for example http://127.0.0.1:7341.
  token_file:
    type: str
    default: ""
    description: Bearer token file for url. Empty means $EXO_HOME/run/exod.token, or $EXO_TOKEN.
  host:
    type: str
    default: 127.0.0.1
    description: Web client bind address.
  port:
    type: int
    default: 7342
    description: Web client port.
  principal_store:
    type: str
    default: ""
    description: Principal store root. Empty falls back to EXO_PRINCIPAL_STORE, then EXO_HOME/principals/EXO_PRINCIPAL.
  decisions_queue:
    type: str
    default: queues/decisions.jsonl
    description: Decisions JSONL file. Relative paths resolve inside principal_store.
  live_window_seconds:
    type: int
    default: 900
    description: A session counts as live if it moved within this many seconds.
  past_window_hours:
    type: int
    default: 24
    description: Finished subagent sessions from this window are listed under Past.
  cost_window_days:
    type: int
    default: 7
    description: Window for the cost panel.
  cost_top_sessions:
    type: int
    default: 25
    description: Rows in the top sessions by cost table.
  project_window_days:
    type: int
    default: 90
    description: Sessions older than this are not clustered into projects.
  project_stall_days:
    type: int
    default: 7
    description: Quiet days before a project moves to Stalled.
  project_abandon_days:
    type: int
    default: 60
    description: Quiet days before a project is flagged as possibly abandoned.
  cache_seconds:
    type: int
    default: 20
    description: Cache for the projects panel. It never refreshes faster than 120 seconds.
  generic_paths:
    type: list
    default: []
    description: Extra directories that must never group sessions into one project.
